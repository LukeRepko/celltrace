<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc"><title id="title">CellTrace wiring: Mega 2560 and four-terminal INA226 breakout</title><desc id="desc">Power off before wiring. Battery positive passes through a fuse into Current plus, then through the shunt and Current minus to a manually disconnected load returning to battery negative. V plus senses fused battery positive; V minus senses battery negative. Mega 5V goes to VCC, GND to GND, D20 to SDA, D21 to SCL. These labels apply to the pictured four-terminal breakout; verify other modules.</desc><!-- Copyright (c) 2026 Luke Repko; SPDX-License-Identifier: GPL-3.0-or-later --><style>text{font-family:Arial,sans-serif;fill:#e8eeee}.small{font-size:17px;fill:#a7bbbd}.label{font-size:20px}.title{font-size:34px;font-weight:700}.kicker{font-size:15px;letter-spacing:2px;fill:#b7ed82}.box{fill:#182226;stroke:#385055;stroke-width:2}.wire{fill:none;stroke-linejoin:round;stroke-linecap:round}.note{font-size:18px;fill:#f5bc70}</style><rect width="1200" height="1020" rx="22" fill="#101719"/><text x="40" y="42" class="kicker">CELLTRACE / WIRING GUIDE</text><text x="40" y="85" class="title">Follow the labels. Keep load current off the Arduino.</text><text x="40" y="120" class="small">Power off before wiring · schematic layout, not physical pin positions</text><rect class="box" x="40" y="185" width="150" height="165" rx="14"/><text x="58" y="225" class="label">BATTERY</text><text x="60" y="265" class="label" style="fill:#ff9b83">+</text><text x="60" y="315" class="label" style="fill:#a6bbc2">−</text><path class="wire" d="M190 250 H255" stroke="#ff9b83" stroke-width="7"/><rect class="box" x="255" y="230" width="100" height="40" rx="14"/><text x="274" y="256" class="small">FUSE</text><path class="wire" d="M355 250 H500" stroke="#ff9b83" stroke-width="7"/><text x="235" y="210" class="small">Close to battery +</text><rect class="box" x="500" y="180" width="300" height="175" rx="14"/><text x="525" y="213" class="label">INA226 BREAKOUT</text><text x="515" y="233" class="small">Current +</text><text x="698" y="233" class="small">Current −</text><path class="wire" d="M500 250 H575 M725 250 H800" stroke="#ff9b83" stroke-width="7"/><rect x="575" y="238" width="150" height="24" fill="#445b54" stroke="#b7ed82"/><text x="584" y="294" class="small">Onboard shunt</text><text x="548" y="335" class="small">V+</text><text x="703" y="335" class="small">V−</text><path class="wire" d="M800 250 H833 M833 250 L876 218 M888 250 H950" stroke="#ff9b83" stroke-width="7"/><circle cx="833" cy="250" r="6" fill="#ff9b83"/><circle cx="888" cy="250" r="6" fill="#ff9b83"/><text x="818" y="183" class="small">Manual disconnect</text><rect class="box" x="950" y="185" width="210" height="165" rx="14"/><text x="975" y="226" class="label">LOAD</text><text x="975" y="260" class="small">Resistor or</text><text x="975" y="286" class="small">suitable DC load</text><text x="975" y="322" class="note">Cooling required</text><path class="wire" d="M190 310 H210 V465 H1055 V350" stroke="#a6bbc2" stroke-width="7"/><text x="280" y="497" class="small">Battery − return: load wiring, not jumper wires</text><path class="wire" d="M410 250 V393 H565 V355" stroke="#f5bc70" stroke-width="3" stroke-dasharray="9 7"/><circle cx="410" cy="250" r="6" fill="#ff9b83"/><text x="425" y="418" class="small">V+ voltage sense</text><path class="wire" d="M720 355 V465" stroke="#73c8ef" stroke-width="3" stroke-dasharray="9 7"/><circle cx="720" cy="465" r="6" fill="#a6bbc2"/><text x="743" y="396" class="small">V− / battery reference</text><text x="40" y="540" class="note">Sense branches also need wire / fuse protection appropriate to their size.</text><rect class="box" x="40" y="585" width="1120" height="345" rx="14"/><text x="65" y="624" class="kicker">SIGNAL WIRING  /  USB powers the Mega; Mega powers the sensor</text><rect class="box" x="90" y="650" width="295" height="240" rx="14"/><text x="115" y="685" class="label">ARDUINO MEGA 2560</text><rect class="box" x="815" y="650" width="290" height="240" rx="14"/><text x="840" y="685" class="label">INA226 HEADER</text><text x="120" y="736" class="label">5V</text><text x="842" y="736" class="label">VCC</text><path class="wire" d="M385 730 H815" stroke="#f5bc70" stroke-width="4"/><circle cx="385" cy="730" r="6" fill="#f5bc70"/><circle cx="815" cy="730" r="6" fill="#f5bc70"/><text x="120" y="781" class="label">GND</text><text x="842" y="781" class="label">GND</text><path class="wire" d="M385 775 H815" stroke="#a6bbc2" stroke-width="4"/><circle cx="385" cy="775" r="6" fill="#a6bbc2"/><circle cx="815" cy="775" r="6" fill="#a6bbc2"/><text x="120" y="826" class="label">20 / SDA</text><text x="842" y="826" class="label">SDA</text><path class="wire" d="M385 820 H815" stroke="#b7ed82" stroke-width="4"/><circle cx="385" cy="820" r="6" fill="#b7ed82"/><circle cx="815" cy="820" r="6" fill="#b7ed82"/><text x="120" y="871" class="label">21 / SCL</text><text x="842" y="871" class="label">SCL</text><path class="wire" d="M385 865 H815" stroke="#73c8ef" stroke-width="4"/><circle cx="385" cy="865" r="6" fill="#73c8ef"/><circle cx="815" cy="865" r="6" fill="#73c8ef"/><text x="420" y="710" class="small">Four low-current wires</text><text x="40" y="964" class="note">V+ measures the battery. VCC supplies the chip. They are different connections.</text><text x="40" y="994" class="small">Leave ALERT and auxiliary IN+ / IN− holes unused on this breakout. Check other board variants.</text></svg>