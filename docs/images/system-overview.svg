<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">CellTrace: the whole test bench</title><desc id="desc">A Linux computer or Raspberry Pi host connects by USB to an Arduino Mega. The Mega connects by I2C to the INA226. A separate fused battery and load circuit passes through the sensor. No Raspberry Pi GPIO connection is used.</desc><!-- Copyright (c) 2026 Luke Repko; SPDX-License-Identifier: GPL-3.0-or-later --><style>text{font-family:Arial,sans-serif;fill:#e8eeee}.small{font-size:17px;fill:#a7bbbd}.label{font-size:20px}.title{font-size:34px;font-weight:700}.kicker{font-size:15px;letter-spacing:2px;fill:#b7ed82}.box{fill:#182226;stroke:#385055;stroke-width:2}.wire{fill:none;stroke-linejoin:round;stroke-linecap:round}.note{font-size:18px;fill:#f5bc70}</style><rect width="1200" height="430" rx="22" fill="#101719"/><text x="40" y="45" class="kicker">CELLTRACE / THE WHOLE BENCH</text><text x="40" y="90" class="title">One battery. One trace. Everything stays local.</text><rect class="box" x="40" y="155" width="320" height="110" rx="14"/><text x="60" y="198" class="label">Computer / Pi</text><text x="60" y="231" class="small">Python recorder + browser</text><rect class="box" x="440" y="155" width="320" height="110" rx="14"/><text x="460" y="198" class="label">Arduino Mega 2560</text><text x="460" y="231" class="small">Firmware + USB power</text><rect class="box" x="840" y="155" width="320" height="110" rx="14"/><text x="860" y="198" class="label">INA226 module</text><text x="860" y="231" class="small">Current + voltage sensor</text><path class="wire" d="M360 207 H440" stroke="#73c8ef" stroke-width="5"/><text x="370" y="185" class="small">USB</text><path class="wire" d="M760 207 H840" stroke="#b7ed82" stroke-width="5"/><text x="768" y="185" class="small">I²C</text><rect class="box" x="440" y="315" width="720" height="70" rx="14"/><text x="460" y="345" class="label">Battery → fuse → sensor shunt → load → battery</text><text x="460" y="371" class="small">High-current circuit · physically disconnect the load to stop discharge</text><path class="wire" d="M1000 265 V315" stroke="#f5bc70" stroke-width="4"/><text x="40" y="327" class="small">Pi uses USB, not GPIO.</text><text x="40" y="355" class="small">Give the host its own power supply.</text><text x="40" y="383" class="small">Pi software setup is not yet bench-tested.</text></svg>